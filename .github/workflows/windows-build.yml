name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: OSIEN-Aplet-Windows-x64
          path: release/OSIEN-Aplet Setup *.exe
          if-no-files-found: error
